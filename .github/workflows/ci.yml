name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # The suite needs a real Postgres: unique indexes, transactions and tenant
      # filters are the behaviours under test and none exist in a fake.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flyrank
          POSTGRES_PASSWORD: flyrank
          POSTGRES_DB: flyrank_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flyrank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://flyrank:flyrank@localhost:5432/flyrank_test
      TEST_DATABASE_URL: postgres://flyrank:flyrank@localhost:5432/flyrank_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keeps the README's one-command promise honest.
      - run: docker compose build api
